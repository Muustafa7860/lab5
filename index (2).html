<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 5 - Volunteer Form</title>
</head>
<body>
  <h1>Volunteer Form</h1>

  <form method="post" action="http://bloomingdale.sat.iit.edu/kriedan/lab3formscript.php">

    <fieldset>
      <legend>My Info</legend>

      <label for="first_name_field">first name:</label>
      <input type="text" id="first_name_field" name="first_name_field"><br>

      <label for="last_name_field">last name:</label>
      <input type="text" id="last_name_field" name="last_name_field"><br>

      <label for="phone_field">phone:</label>
      <input type="text" id="phone_field" name="phone_field"><br>

      <label for="email_field">email:</label>
      <input type="text" id="email_field" name="email_field"><br>

      Gender:<br>
      <label for="gender_male">Male</label>
      <input type="radio" id="gender_male" name="gender_field" value="male">
      <label for="gender_female">Female</label>
      <input type="radio" id="gender_female" name="gender_field" value="female"><br>

      <label for="age_field">Age:</label><br>
      <select id="age_field" name="age_field">
        <option value="under 18">under 18</option>
        <option value="over 18">over 18</option>
      </select>
    </fieldset>

    <fieldset>
      <legend>My Availability</legend>

      <h2>Days Available:</h2>

      <label for="day_sun">Sunday</label>
      <input type="checkbox" id="day_sun" name="available_field[]" value="sunday"><br>
      <label for="day_mon">Monday</label>
      <input type="checkbox" id="day_mon" name="available_field[]" value="monday"><br>
      <label for="day_tue">Tuesday</label>
      <input type="checkbox" id="day_tue" name="available_field[]" value="tuesday"><br>
      <label for="day_wed">Wednesday</label>
      <input type="checkbox" id="day_wed" name="available_field[]" value="wednesday"><br>
      <label for="day_thu">Thursday</label>
      <input type="checkbox" id="day_thu" name="available_field[]" value="thursday"><br>
      <label for="day_fri">Friday</label>
      <input type="checkbox" id="day_fri" name="available_field[]" value="friday"><br>
      <label for="day_sat">Saturday</label>
      <input type="checkbox" id="day_sat" name="available_field[]" value="saturday"><br>

      <h2><label for="comments_field">Comments</label></h2>
      <textarea id="comments_field" name="comments_field" rows="2" cols="20"></textarea>
    </fieldset>

    <input type="hidden" name="hidden_field" value="MustafaAziz">

    <input type="submit" value="Submit Query">
  </form>
</body>
</html>
